name: Backend PostgreSQL
on:
  push:
    branches: [main, etapa-7b2-backend, etapa-7b3-catalogo]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: atram_test_ci
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: synthetic_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_runner -d atram_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BACKEND_TEST_DATABASE_URL: postgresql://test_runner:synthetic_ci_only@127.0.0.1:5432/atram_test_ci
      BACKEND_TEST_DATABASE_APPROVED: 'yes'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:stage7b2
      - run: npm run check:stage7b3
      - name: PostgreSQL 7B.4B B01–B24
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run check:stage7b4b 2>&1 | tee test-results/7b4b.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etapa7b4b-postgresql
          path: test-results/7b4b.log
      - run: npm run check:stage7b3:performance
      - uses: actions/upload-artifact@v4
        with:
          name: etapa7b3-performance-node
          path: docs/etapa7B3/PERFORMANCE-NODE.json
      - run: npm run check:data
      - run: npm run check:stage2
      - run: npm run check:stage3
      - run: npm run check:stage4
      - run: npm run check:stage5
      - run: npm run check:stage6
      - run: npm run check:stage7b1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /pedidosAtram
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run check:backend-boundary
